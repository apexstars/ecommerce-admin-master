services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # S3-compatible object storage for product images (optional in dev).
  # Start with: docker compose --profile storage up -d, then create the S3_BUCKET bucket (public-read).
  # Any S3-compatible service works; point S3_* in apps/api/.env at it.
  storage:
    image: rustfs/rustfs:latest
    profiles: ["storage"]
    environment:
      RUSTFS_ACCESS_KEY: minio
      RUSTFS_SECRET_KEY: minio-secret
    ports:
      - "9000:9000"
    volumes:
      - storagedata:/data

volumes:
  pgdata:
  storagedata:
